refused_cues:
  - pattern: "(no|not|don't want|without|rather not|avoid) (medication|meds|drugs|pills)"
    refuses: [medication-led]
  - pattern: "(no|not|don't want|rather not) (telehealth|video|online|zoom)"
    refuses: [telehealth]
  - pattern: "(not|don't want|no) (a )?(man|male)"
    sets: { gender: woman }
  - pattern: "(not|don't want|no) (a )?(woman|female)"
    sets: { gender: man }

