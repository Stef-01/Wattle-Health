# Cross-specialty MVP vocabulary (writing-block.md §2): women's health, mental health and
# overlooked chronic conditions, matched across the Ahpra specialties that appropriately treat
# each rather than forced into one. Same loader and cue discipline as psychiatry.yaml.
#
# CUE DISCIPLINE. Multi-word cues wherever a bare word has an ordinary-English reading: the
# port's false-positive register (src/matching/known-fps.ts) measured "ice", "flat", "checking",
# "court", "memory", "free", "patient" firing on sentences about ice packs, flats, websites,
# courthouses and free appointments. None of those bare words appears below; where psychiatry
# kept them this file carries the narrowed pair ("feel flat", "checking rituals").
#
# SPECIALTIES. `specialties:` on each condition = the Ahpra specialties / fields of specialty
# practice that treat it. The Layer-1 filter keeps a doctor whose specialty is in the union over
# the asked conditions and excludes the rest as "wrong-specialty". The mapping is a founder
# decision (CLAUDE.md: the yaml is the founder's vocabulary) and is listed for sign-off in the
# 2026-10-15 log entry.
#
# ALLIED HEALTH (founder 2026-10-19: "add in all providers not just GPs"). `psychology` is named
# on the mental-health conditions psychologists treat; `occupational-therapy` on ADHD and autism;
# `allied-health` (coaches, dietitians, physios, social workers, counsellors...) on ADHD only, the
# one condition every provider in that group lists. `prescriber: true` marks a condition whose
# care needs a medical prescriber: there, every doctor who passes Layer 1 ranks above every
# allied provider (src/matching/index.ts), so allied providers widen the list, never lead it.
slug: mvp
label: Doctor
register: ahpra
referral_required: false         # varies by specialty; GP needs none, the rest need a GP referral for the rebate
capacity_semantics: waitlist
fee_model: mixed

populations:
  - id: child
    cues: [child, kid, son, daughter, "year old", primary school, "my boy", "my girl", "my little one"]
    age: [0, 12]
  - id: adolescent
    cues: [teen, teenager, adolescent, high school, year 10, year 11, year 12]
    age: [12, 18]
  - id: adult
    cues: [adult, myself, husband, wife, partner]
  - id: older-adult
    cues: [mum, dad, mother, father, grandmother, grandfather, nan, elderly, "in her 70s", "in his 70s", "in her 80s", "in his 80s", aged care]
  - id: perinatal
    cues: [pregnant, pregnancy, postnatal, postpartum, newborn, after the birth, since the birth, breastfeeding, antenatal, "new mum", "after having my baby", "since having my baby", "trying to conceive", ivf, fertility]

